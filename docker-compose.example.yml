# 示例：将 updater 与业务栈放在同一 Compose 项目中时使用。
# 在宿主部署目录的 .env 中设置 DEPLOY_DIR=<该目录的绝对路径>（不含空白）。
# 被管理的 compose 文件不得引用 updater 自身的环境变量名（PORT、COMPOSE_PROJECT_DIR 等，见 README）。

services:
  updater:
    image: ghcr.io/biu7/updater:latest
    # 不发布端口：只供同一内部网络中的调用方访问（服务无认证且持有 docker.sock）。
    expose:
      - "8080"
    environment:
      PORT: "8080"
      # 同路径挂载：容器内项目目录与宿主路径一致，compose 相对路径（卷、secrets、env_file）才能解析为正确的宿主路径。
      COMPOSE_PROJECT_DIR: ${DEPLOY_DIR:?}
      # 仅允许操作的服务名，逗号分隔；必须排除 updater 自身
      ALLOWED_SERVICES: web,api
      # 不要设置 COMPOSE_FILE / COMPOSE_PROJECT_NAME。
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DEPLOY_DIR:?}:${DEPLOY_DIR}:ro
      # 宿主 root 的 docker config 单文件只读挂入（不能使用 credsStore/credHelpers）。
      # 文件必须事先存在：私有 registry 先 docker login；只用公开镜像时可创建内容为 {} 的文件。
      # create_host_path: false 防止文件缺失时被自动创建成目录。
      # 重新 docker login 后需 docker compose up -d --force-recreate updater。
      - type: bind
        source: ${UPDATER_DOCKER_CONFIG:-/root/.docker/config.json}
        target: /root/.docker/config.json
        read_only: true
        bind:
          create_host_path: false
    networks:
      - updater
    restart: unless-stopped

  # 调用方示例：与 updater 共享 updater 网络。
  # web:
  #   image: ghcr.io/owner/web:latest
  #   networks: [updater]

networks:
  updater:
    driver: bridge
